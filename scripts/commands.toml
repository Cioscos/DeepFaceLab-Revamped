    "--model",     "SAEHD",
  ]

# SAEHDX esporta con il codice di SAEHD, non con una sua variante:
# ExportDFM.main costruisce il modello con cpu_only=True cablato, e il ramo
# veloce di SAEHDX (channels_last, autocast, l'hook di risalita a fp32) e'
# sotto `if nn.device.type == "cuda"`. Sulla CPU non si attiva, quindi il
# grafo esportato e' quello del genitore: verificato, opset 12, in_face:0 ->
# out_face_mask:0 / out_celeb_face:0 / out_celeb_face_mask:0.
[[command]]
name = "6) export SAEHDX as dfm"
kind = "main"
pause = "always"
  [[command.invocation]]
  verb = ["exportdfm"]
  args = [
    "--model-dir", "{WORKSPACE}/model",
    "--model",     "SAEHDX",
  ]

