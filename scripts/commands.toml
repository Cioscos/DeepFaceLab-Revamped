# Fonte di verita' dei passi utente. Un solo posto in cui esistono, per
# entrambi i sistemi.
#
# Segnaposto ammessi: {WORKSPACE}, {INTERNAL}, {DFL_ROOT}.
#
# passthrough = true significa che l'ultima invocazione ha un argomento senza
# valore (es. "--input-file"): il generatore vi accoda %1 (bat) o "$1" (sh)
# come ultimo token di quella riga. Non e' un segnaposto: e' cablato nel
# generatore, non nel TOML.
#
# Questo file e' la sola fonte di verita' dei comandi utente: gli script .bat
# e .sh sotto scripts/ sono generati da qui, e vanno rigenerati invece che
# modificati a mano.

# L'unico comando distruttivo dei 56: cancella data_src, data_dst e model
# dell'utente. pause_before + echo riproducono la conferma che l'ancora fa
# PRIMA di toccare qualunque cartella ("Press space if you want to delete
# content in workspace folder" poi pause) -- senza, un doppio clic sbagliato
# cancella ore o giorni di estrazione/addestramento senza modo di annullare.
[[command]]
name = "1) clear workspace"
kind = "clear"
pause = "always"
pause_before = true
echo = ["Press space if you want to delete content in workspace folder"]

[[command]]
name = "10.misc) start EBSynth"
kind = "ebsynth"
pause = "never"

[[command]]
name = "2) extract images from video data_src"
kind = "main"
pause = "always"
mkdirs = ["{WORKSPACE}/data_src"]
  [[command.invocation]]
  verb = ["videoed", "extract-video"]
  args = [
    "--input-file", "{WORKSPACE}/data_src.*",
    "--output-dir", "{WORKSPACE}/data_src",
  ]

# L'unico script che inoltra un argomento: chi trascina un video sull'icona
# lo riceve come %1 (bat) / "$1" (sh) dopo --input-file.
[[command]]
name = "3) cut video (drop video on me)"
kind = "main"
pause = "always"
passthrough = true
  [[command.invocation]]
  verb = ["videoed", "cut-video"]
  args = ["--input-file"]

[[command]]
name = "3) extract images from video data_dst FULL FPS"
kind = "main"
pause = "always"
mkdirs = ["{WORKSPACE}/data_dst"]
  [[command.invocation]]
  verb = ["videoed", "extract-video"]
  args = [
    "--input-file",  "{WORKSPACE}/data_dst.*",
    "--output-dir",  "{WORKSPACE}/data_dst",
    "--fps",         "0",
  ]

[[command]]
name = "3.optional) denoise data_dst images"
kind = "main"
pause = "always"
  [[command.invocation]]
  verb = ["videoed", "denoise-image-sequence"]
  args = ["--input-dir", "{WORKSPACE}/data_dst"]

[[command]]
name = "4) data_src faceset extract MANUAL"
kind = "main"
pause = "always"
  [[command.invocation]]
  verb = ["extract"]
  args = [
    "--input-dir",  "{WORKSPACE}/data_src",
    "--output-dir", "{WORKSPACE}/data_src/aligned",
    "--detector",   "manual",
  ]

# Scorciatoia (SHORTCUTS): depositata anche nella root dell'installazione.
